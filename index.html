<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ไทยโพธิ์ดี ช็อป</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
    body { background: linear-gradient(135deg, #f8f9fa, #e9ecef); min-height: 100vh; padding: 20px; }
    .header { 
      text-align: center; 
      padding: 25px 0; 
      background: linear-gradient(90deg, #A51931, #FFFFFF, #2E42A5); 
      border-radius: 16px; 
      margin-bottom: 30px; 
      box-shadow: 0 4px 20px rgba(0,0,0,0.1); 
    }
    .header h1 { 
      color: #162975; 
      font-size: 28px; 
      font-weight: bold; 
      text-shadow: 2px 2px 4px rgba(0,0,0,0.15); 
    }
    .upload-box { 
      background: white; 
      border-radius: 16px; 
      padding: 25px; 
      margin-bottom: 30px; 
      box-shadow: 0 4px 20px rgba(0,0,0,0.08); 
      border: 3px solid #2E42A5; 
    }
    .upload-box h3 { color: #A51931; margin-bottom: 15px; font-size: 20px; }
    input[type="text"], input[type="file"] { 
      width: 100%; 
      padding: 12px; 
      margin: 8px 0 15px 0; 
      border: 2px solid #ddd; 
      border-radius: 8px; 
      font-size: 16px; 
    }
    input:focus { border-color: #A51931; outline: none; }
    button { 
      background: linear-gradient(90deg, #A51931, #c02440); 
      color: white; 
      border: none; 
      padding: 14px 30px; 
      border-radius: 8px; 
      font-size: 18px; 
      font-weight: bold; 
      cursor: pointer; 
      width: 100%; 
      transition: all 0.3s ease; 
      box-shadow: 0 3px 10px rgba(165, 25, 49, 0.3);
    }
    button:hover { transform: scale(1.02); box-shadow: 0 5px 15px rgba(165, 25, 49, 0.4); }
    #upload-status { margin-top: 15px; font-weight: bold; font-size: 16px; }
    .video-card { 
      background: white; 
      border-radius: 16px; 
      padding: 15px; 
      margin-bottom: 20px; 
      box-shadow: 0 4px 15px rgba(0,0,0,0.08); 
      border-left: 5px solid #A51931; 
      transition: transform 0.2s ease;
    }
    .video-card:hover { transform: translateY(-3px); }
    .video-card h3 { color: #162975; margin-bottom: 10px; }
    video { width: 100%; border-radius: 12px; }
