<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>แพลตฟอร์มวิดีโอ</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    html, body { background: #fff; color: #000; min-height: 100vh; padding-bottom: 70px; overflow-x: hidden; }

    /* ===== TOP BAR ===== */
    .top-bar { position: fixed; top: 0; left: 0; right: 0; z-index: 100; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; background: #fff; border-bottom: 1px solid #eee; }
    .top-left, .top-right { display: flex; gap: 16px; align-items: center; }
    .top-icon { font-size: 22px; cursor: pointer; }

    /* ===== PROFILE CONTAINER — รูปแบบเหมือน TikTok เป๊ะ ===== */
    .profile-container { padding-top: 60px; max-width: 700px; margin: 0 auto; }
    .profile-header { text-align: center; padding: 20px 16px; }

    /* Avatar — แต่ละคนอัปโหลดเองได้ */
    .avatar-wrap { position: relative; display: inline-block; margin-bottom: 12px; }
    .avatar { width: 96px; height: 96px; border-radius: 50%; object-fit: cover; border: 3px solid #eee; background: #ddd; }
    .avatar-edit { position: absolute; bottom: 0; right: 0; width: 28px; height: 28px; border-radius: 50%; background: #000; color: #fff; font-size: 18px; font-weight: bold; display: flex; align-items: center; justify-content: center; cursor: pointer; border: 2px solid #fff; line-height: 1; }
    #avatarInput { display: none; }

    /* ชื่อ — แต่ละคนตั้งเองได้ */
    .full-name { font-size: 20px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 6px; margin-bottom: 4px; }
    .age-badge { background: #eee; color: #666; font-size: 12px; padding: 2px 6px; border-radius: 10px; }
    .username { font-size: 14px; color: #666; margin-bottom: 16px; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .edit-name-btn { border: 1px solid #ccc; background: #fff; padding: 6px 16px; border-radius: 4px; font-size: 14px; cursor: pointer; }

    /* สถิติ — แต่ละคนมีค่าของตัวเอง */
    .stats-row { display: flex; justify-content: center; gap: 32px; margin-bottom: 16px; }
    .stat { text-align: center; cursor: pointer; }
    .stat-num { font-size: 18px; font-weight: 700; }
    .stat-label { font-size: 12px; color: #666; margin-top: 2px; }

    /* คำอธิบาย — แต่ละคนเขียนเองได้ */
    .bio { font-size: 14px; line-height: 1.5; padding: 0 20px; margin-bottom: 16px; white-space: pre-wrap; }
    .edit-bio-btn { color: #999; font-size: 13px; cursor: pointer; }

    /* ปุ่มการกระทำ */
    .action-buttons { display: flex; justify-content: center; gap: 24px; margin-bottom: 20px; }
    .action-btn { display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; font-size: 12px; }
    .action-icon { font-size: 20px; }
    .red-text { color: #fe2c55; }

    /* แถบไอคอนเมนู */
    .tabs-bar { display: flex; justify-content: space-around; border-top: 1px solid #eee; border-bottom: 1px solid #eee; padding: 10px 0; margin-bottom: 4px; }
    .tab-icon { font-size: 22px; cursor: pointer; opacity: 0.5; }
    .tab-icon.active { opacity: 1; border-bottom: 2px solid #000; padding-bottom: 8px; }

    /* ตารางวิดีโอ — 3 คอลัมน์ เหมือน TikTok */
    .videos-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 0 4px; }
    .video-item { position: relative; aspect-ratio: 9/12; background: #eee; border-radius: 2px; overflow: hidden; cursor: pointer; }
    .video-thumb { width: 100%; height: 100%; object-fit: cover; }
    .video-views { position: absolute; bottom: 6px; left: 6px; color: #fff; font-size: 12px; text-shadow: 0 0 3px rgba(0,0,0,0.8); display: flex; align-items: center; gap: 4px; }
    .play-icon { font-size: 10px; }
    .empty-grid { grid-column: 1 / -1; padding: 60px 20px; text-align: center; color: #999; font-size: 14px; }

    /* เมนูล่าง — เหมือน TikTok */
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-top: 1px solid #eee; display: flex; justify-content: space-around; padding: 8px 0 16px; z-index: 100; }
    .nav-item { display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; color: #000; opacity: 0.5; transition: all 0.2s; }
    .nav-item.active { opacity: 1; }
    .nav-icon { font-size: 24px; line-height: 1; }
    .nav-label { font-size: 10px; }
    .nav-add { width: 44px; height: 32px; background: linear-gradient(90deg, #25f4ee, #fe2c55); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 24px; font-weight: bold; }

    /* MODAL แก้ไขข้อมูล */
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 200; display: none; align-items: center; justify-content: center; padding: 20px; }
    .modal.active { display: flex; }
    .modal-box { background: #fff; border-radius: 16px; width: 100%; max-width: 360px; padding: 24px; }
    .modal-title { font-size: 18px; font-weight: 700; text-align: center; margin-bottom: 20px; }
    input, textarea { width: 100%; padding: 12px; margin-bottom: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
    .modal-buttons { display: flex; gap: 10px; margin-top: 8px; }
    .btn { flex: 1; padding: 12px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 14px; }
    .btn-cancel { background: #eee; color: #333; }
    .btn-save { background: #fe2c55; color: #fff; }
  </style>
</head>
<body>

  <!-- TOP BAR -->
  <div class="top-bar">
    <div class="top-left">
      <span class="top-icon" onclick="alert('ค้นหา / เพิ่ม')">+</span>
      <span class="top-icon" onclick="alert('โปรไฟล์สาธารณะ')">P</span>
    </div>
    <div class="top-right">
      <span class="top-icon">👤</span>
      <span class="top-icon">3</span>
      <span class="top-icon">↗</span>
      <span class="top-icon">☰</span>
    </div>
  </div>

  <!-- ===== PROFILE PAGE — สาธารณะ ทุกคนสร้างเองได้ ===== -->
  <div class="profile-container">
    <div class="profile-header">
      <!-- รูปโปรไฟล์ — แต่ละคนอัปโหลดเอง -->
      <div class="avatar-wrap">
        <img id="avatar" class="avatar" src="https://via.placeholder.com/96" alt="รูปโปรไฟล์">
        <span class="avatar-edit" onclick="document.getElementById('avatarInput').click()">+</span>
        <input type="file" id="avatarInput" accept="image/*" onchange="changeAvatar(this)">
      </div>

      <!-- ชื่อ — แต่ละคนตั้งเองได้ -->
      <div class="full-name">
        <span id="fullName">ชื่อผู้ใช้</span>
        <span class="age-badge">9+</span>
        <span class="edit-name-btn" onclick="openEditNameModal()">✏️</span>
      </div>
      <div class="username">
        <span id="username">@username</span>
      </div>

      <!-- สถิติ — แต่ละคนมีของตัวเอง -->
      <div class="stats-row">
        <div class="stat">
          <div class="stat-num" id="following">0</div>
          <div class="stat-label">กำลังติดตาม</div>
        </div>
        <div class="stat">
          <div class="stat-num" id="followers">0</div>
          <div class="stat-label">ผู้ติดตาม</div>
        </div>
        <div class="stat">
          <div class="stat-num" id="likes">0</div>
          <div class="stat-label">ถูกใจ</div>
        </div>
      </div>

      <!-- คำอธิบาย — แต่ละคนเขียนเองได้ -->
      <div class="bio" id="bio">ยินดีต้อนรับ! แก้ไขคำอธิบายได้ตามต้องการ</div>
      <span class="edit-bio-btn" onclick="openEditBioModal()">แก้ไขคำอธิบาย</span>

      <!-- ปุ่มการกระทำ -->
      <div class="action-buttons">
        <div class="action-btn">
          <span class="action-icon red-text">✉️</span>
          <span>อีเมล</span>
        </div>
        <div class="action-btn">
          <span class="action-icon red-text">🛒</span>
          <span>คำสั่งซื้อของคุณ</span>
        </div>
      </div>
    </div>

    <!-- แถบไอคอนเมนู -->
    <div class="tabs-bar">
      <span class="tab-icon active" onclick="switchTab('grid')">☰</span>
      <span class="tab-icon" onclick="switchTab('private')">🔒</span>
      <span class="tab-icon" onclick="switchTab('liked')">↻</span>
      <span class="tab-icon" onclick="switchTab('saved')">🔖</span>
      <span class="tab-icon" onclick="switchTab('hearts')">❤️</span>
    </div>

    <!-- ตารางวิดีโอ -->
    <div class="videos-grid" id="videosGrid">
      <div class="empty-grid">ยังไม่มีวิดีโอ<br>กดปุ่ม + เพื่อสร้างวิดีโอแรกของคุณ</div>
    </div>
  </div>

  <!-- เมนูล่าง -->
  <div class="bottom-nav">
    <div class="nav-item active" onclick="switchPage('home')">
      <span class="nav-icon">🏠</span>
      <span class="nav-label">หน้าแรก</span>
    </div>
    <div class="nav-item" onclick="switchPage('shop')">
      <span class="nav-icon">🛒</span>
      <span class="nav-label">ร้านค้า</span>
    </div>
    <div class="nav-item" onclick="alert('เปิดหน้าต่างอัปโหลด')">
      <span class="nav-add">+</span>
    </div>
    <div class="nav-item" onclick="switchPage('inbox')">
      <span class="nav-icon">💬</span>
      <span class="nav-label">กล่องข้อความ</span>
    </div>
    <div class="nav-item" onclick="switchPage('profile')">
      <span class="nav-icon">👤</span>
      <span class="nav-label">โปรไฟล์</span>
    </div>
  </div>

  <!-- MODAL: แก้ไขชื่อ -->
  <div class="modal" id="editNameModal">
    <div class="modal-box">
      <div class="modal-title">แก้ไขชื่อ</div>
      <input type="text" id="inputFullName" placeholder="ชื่อที่แสดง">
      <input type="text" id="inputUsername" placeholder="@ชื่อผู้ใช้">
      <div class="modal-buttons">
        <button class="btn btn-cancel" onclick="closeModal('editNameModal')">ยกเลิก</button>
        <button class="btn btn-save" onclick="saveNames()">บันทึก</button>
      </div>
    </div>
  </div>

  <!-- MODAL: แก้ไขคำอธิบาย -->
  <div class="modal" id="editBioModal">
    <div class="modal-box">
      <div class="modal-title">แก้ไขคำอธิบาย</div>
      <textarea id="inputBio" rows="4" placeholder="เขียนคำอธิบายโปรไฟล์ของคุณ..."></textarea>
      <div class="modal-buttons">
        <button class="btn btn-cancel" onclick="closeModal('editBioModal')">ยกเลิก</button>
        <button class="btn btn-save" onclick="saveBio()">บันทึก</button>
      </div>
    </div>
  </div>

  <script>
    // ===== เปลี่ยนรูปโปรไฟล์ — แต่ละคนอัปโหลดของตัวเอง =====
    function changeAvatar(input) {
      if (!input.files || !input.files[0]) return;
      const url = URL.createObjectURL(input.files[0]);
      document.getElementById('avatar').src = url;
      saveUserData('avatar', url);
    }

    // ===== เปิด/ปิด MODAL =====
    function openEditNameModal() {
      document.getElementById('inputFullName').value = document.getElementById('fullName').textContent;
      document.getElementById('inputUsername').value = document.getElementById('username').textContent.replace('@', '');
      document.getElementById('editNameModal').classList.add('active');
    }
    function openEditBioModal() {
      document.getElementById('inputBio').value = document.getElementById('bio').textContent;
      document.getElementById('editBioModal').classList.add('active');
    }
    function closeModal(id) {
      document.getElementById(id).classList.remove('active');
    }

    // ===== บันทึกชื่อ =====
    function saveNames() {
      const fullName = document.getElementById('inputFullName').value.trim() || 'ชื่อผู้ใช้';
      const username = document.getElementById('inputUsername').value.trim() || 'username';
      document.getElementById('fullName').textContent = fullName;
      document.getElementById('username').textContent = '@' + username;
      saveUserData('fullName', fullName);
      saveUserData('username', username);
      closeModal('editNameModal');
    }

    // ===== บันทึกคำอธิบาย =====
    function saveBio() {
      const bio = document.getElementById('inputBio').value.trim() || 'ยินดีต้อนรับ! แก้ไขคำอธิบายได้ตามต้องการ';
      document.getElementById('bio').textContent = bio;
      saveUserData('bio', bio);
      closeModal('editBioModal');
    }

    // ===== สลับแท็บวิดีโอ =====
    function switchTab(tabName) {
      document.querySelectorAll('.tab-icon').forEach(t => t.classList.remove('active'));
      event.target.classList.add('active');
    }

    // ===== สลับหน้า =====
    function switchPage(pageName) {
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
      event.currentTarget.classList.add('active');
      alert('ไปที่หน้า: ' + pageName);
    }

    // ===== บันทึก/โหลดข้อมูลผู้ใช้ — แยกแต่ละคน =====
    function saveUserData(key, value) {
      localStorage.setItem('user_' + key, value);
    }
    function loadUserData(key, defaultValue) {
      return localStorage.getItem('user_' + key) || defaultValue;
    }

    // ===== โหลดข้อมูลตอนเปิดหน้า =====
    window.addEventListener('load', () => {
      const savedAvatar = loadUserData('avatar', '');
      if (savedAvatar) document.getElementById('avatar').src = savedAvatar;
      
      document.getElementById('fullName').textContent = loadUserData('fullName', 'ชื่อผู้ใช้');
      document.getElementById('username').textContent = '@' + loadUserData('username', 'username');
      document.getElementById('bio').textContent = loadUserData('bio', 'ยินดีต้อนรับ! แก้ไขคำอธิบายได้ตามต้องการ');
      
      // สถิติ — ในระบบจริงจะดึงจากฐานข้อมูล
      document.getElementById('following').textContent = loadUserData('following', '0');
      document.getElementById('followers').textContent = loadUserData('followers', '0');
      document.getElementById('likes').textContent = loadUserData('likes', '0');
    });
  </script>
</body>
</html>
