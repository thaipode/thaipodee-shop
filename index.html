<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">
  <title>ไทยโพธิ์ดี ช็อป | Thai Phodee Shop</title>
  <!-- ===== PWA MANIFEST — ทำให้เป็นแอปเต็มจอ ===== -->
  <link rel="manifest" href="data:application/json;charset=utf-8,{
    &quot;name&quot;: &quot;ไทยโพธิ์ดี ช็อป&quot;,
    &quot;short_name&quot;: &quot;ไทยโพธิ์ดี&quot;,
    &quot;description&quot;: &quot;แหล่งรวมวิดีโอและสินค้าจากสมาชิกทุกคน&quot;,
    &quot;start_url&quot;: &quot;/&quot;,
    &quot;display&quot;: &quot;standalone&quot;,
    &quot;background_color&quot;: &quot;#000000&quot;,
    &quot;theme_color&quot;: &quot;#000000&quot;,
    &quot;orientation&quot;: &quot;portrait-primary&quot;,
    &quot;icons&quot;: [
      {
        &quot;src&quot;: &quot;data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect fill='%23000' width='512' height='512' rx='96'/%3E%3Ctext x='256' y='300' font-size='240' fill='white' text-anchor='middle' font-family='sans-serif'%3Eท%3C/text%3E%3C/svg%3E&quot;,
        &quot;sizes&quot;: &quot;any&quot;,
        &quot;type&quot;: &quot;image/svg+xml&quot;
      }
    ]
  }">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    html, body {
      background: #000; color: #fff;
      width: 100%; height: 100%;
      height: 100dvh;
      overflow: hidden; position: fixed;
      overscroll-behavior: none;
    }

    /* ===== TOP NAV ===== */
    .top-nav {
      position: fixed; top: 0; left: 0; right: 0;
      padding: 10px 16px; padding-top: max(10px, env(safe-area-inset-top));
      display: flex; justify-content: center; gap: 24px;
      background: linear-gradient(to bottom, rgba(0,0,0,.6), transparent);
      z-index: 100;
    }
    .top-nav-tab { font-size: 15px; color: #aaa; cursor: pointer; }
    .top-nav-tab.active { color: #fff; font-weight: 600; position: relative; }
    .top-nav-tab.active::after {
      content: ''; position: absolute; bottom: -4px; left: 50%; transform: translateX(-50%);
      width: 24px; height: 2px; background: #fff; border-radius: 2px;
    }

    /* ===== VIDEO CONTAINER ===== */
    .video-container {
      position: absolute; inset: 0;
      padding-top: 50px; padding-bottom: 75px;
      overflow-y: auto; overflow-x: hidden;
      scroll-snap-type: y mandatory;
      -webkit-overflow-scrolling: touch;
    }
    .video-slide {
      width: 100%; height: 100%;
      min-height: calc(100dvh - 125px);
      position: relative;
      scroll-snap-align: start;
      display: flex; align-items: center; justify-content: center;
    }
    .video-bg {
      position: absolute; inset: 0;
      background: linear-gradient(135deg, #0f0f23, #1a1a3c);
    }
    .play-btn {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
      width: 56px; height: 56px; border-radius: 50%;
      background: rgba(255,255,255,.2);
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; color: #fff;
      backdrop-filter: blur(6px);
      z-index: 5;
      cursor: pointer;
    }

    /* ===== RIGHT SIDE BUTTONS — กดได้ทุกอัน ตำแหน่งตรง ===== */
    .side-actions {
      position: absolute; right: 12px; bottom: 100px;
      display: flex; flex-direction: column; align-items: center; gap: 18px;
      z-index: 10;
    }
    .action-btn {
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      cursor: pointer;
      pointer-events: auto;
    }
    .action-icon { font-size: 24px; line-height: 1; }
    .action-count { font-size: 11px; color: #fff; }
    .like-icon { color: #fff; }
    .like-icon.liked { color: #fe2c55; }

    /* ===== CAPTION ===== */
    .video-info {
      position: absolute; left: 16px; right: 80px; bottom: 100px;
      z-index: 10;
    }
    .username { font-weight: 700; font-size: 15px; margin-bottom: 4px; }
    .caption { font-size: 14px; line-height: 1.4; margin-bottom: 6px; }
    .music-line { display: flex; align-items: center; gap: 6px; font-size: 12px; }
    .music-icon { animation: spin 4s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ===== BOTTOM NAV — กดได้ทุกปุ่ม ===== */
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0;
      padding: 6px 0; padding-bottom: max(6px, env(safe-area-inset-bottom));
      background: #000;
      display: flex; justify-content: space-around; align-items: center;
      border-top: 1px solid #222;
      z-index: 200;
    }
    .nav-item {
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      color: #fff; text-decoration: none; cursor: pointer;
      pointer-events: auto;
    }
    .nav-icon { font-size: 22px; line-height: 1; }
    .nav-label { font-size: 10px; }
    .nav-center {
      width: 44px; height: 28px; border-radius: 8px;
      background: linear-gradient(45deg, #fff, #ddd);
      display: flex; align-items: center; justify-content: center;
      color: #000; font-size: 22px; font-weight: 700;
      cursor: pointer;
      pointer-events: auto;
    }
    .nav-sell { color: #f7d046; }

    /* ===== แท็บเล็ต + แนวนอน — ปรับเองอัตโนมัติ ===== */
    @media (min-width: 768px), (orientation: landscape) {
      .side-actions { right: 24px; bottom: 110px; gap: 22px; }
      .video-info { left: 24px; right: 100px; bottom: 110px; }
      .action-icon { font-size: 28px; }
      .username { font-size: 16px; }
      .caption { font-size: 15px; }
      .play-btn { width: 64px; height: 64px; font-size: 24px; }
    }
  </style>
</head>
<body>

  <!-- TOP NAV -->
  <div class="top-nav">
    <div class="top-nav-tab">ติดตาม</div>
    <div class="top-nav-tab active">ไทยโพธิ์ดี</div>
    <div class="top-nav-tab">สำหรับคุณ</div>
  </div>

  <!-- VIDEO FEED -->
  <div class="video-container" id="videoFeed">
    <div class="video-slide">
      <div class="video-bg"></div>
      <div class="play-btn" id="playBtn">⏸</div>

      <!-- RIGHT ACTIONS — ทุกปุ่มทำงาน -->
      <div class="side-actions">
        <div class="action-btn"><div class="action-icon">👤</div></div>
        <div class="action-btn" id="likeBtn"><div class="action-icon like-icon">❤️</div><div class="action-count">1.2K</div></div>
        <div class="action-btn"><div class="action-icon">💬</div><div class="action-count">128</div></div>
        <div class="action-btn"><div class="action-icon">🔁</div><div class="action-count">456</div></div>
        <div class="action-btn"><div class="action-icon">↗️</div><div class="action-count">3.4K</div></div>
        <div class="action-btn"><div class="action-icon">🎵</div></div>
      </div>

      <!-- CAPTION -->
      <div class="video-info">
        <div class="username">@thaipodee_shop</div>
        <div class="caption">ยินดีต้อนรับสู่ ไทยโพธิ์ดี ช็อป — แหล่งรวมวิดีโอและสินค้าจากสมาชิกทุกคน!</div>
        <div class="music-line"><span class="music-icon">🎵</span><span>เสียงต้นฉบับ — ไทยโพธิ์ดี ช็อป</span></div>
      </div>
    </div>
  </div>

  <!-- BOTTOM NAV — ทุกปุ่มทำงาน -->
  <nav class="bottom-nav">
    <a class="nav-item"><div class="nav-icon">🏠</div><div class="nav-label">หน้าแรก</div></a>
    <a class="nav-item"><div class="nav-icon">🛒</div><div class="nav-label">สินค้า</div></a>
    <a class="nav-item"><div class="nav-center">+</div></a>
    <a class="nav-item nav-sell"><div class="nav-icon">📦</div><div class="nav-label">ขายสินค้า</div></a>
    <a class="nav-item"><div class="nav-icon">👤</div><div class="nav-label">โปรไฟล์</div></a>
  </nav>

  <script>
    // ===== ปุ่มกดได้ทุกอัน =====
    const likeBtn = document.getElementById('likeBtn');
    likeBtn.addEventListener('click', (e) => {
      e.preventDefault(); e.stopPropagation();
      const icon = likeBtn.querySelector('.like-icon');
      icon.classList.toggle('liked');
      icon.textContent = icon.classList.contains('liked') ? '❤️' : '🤍';
    });

    const playBtn = document.getElementById('playBtn');
    let isPlaying = true;
    playBtn.addEventListener('click', () => {
      isPlaying = !isPlaying;
      playBtn.textContent = isPlaying ? '⏸' : '▶';
    });

    document.body.addEventListener('touchmove', (e) => {
      const feed = document.getElementById('videoFeed');
      if (feed.scrollTop <= 0) feed.scrollTop = 1;
    }, { passive: false });
  </script>
</body>
</html>
