<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ไทยโพธิ์ดี ช็อป</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
    body { background: #000; color: #fff; min-height: 100vh; padding-bottom: 70px; }
    
    /* Header */
    .header {
      background: linear-gradient(90deg, #d81e05 0%, #005aff 100%);
      padding: 12px;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .upload-btn {
      background: #fff;
      color: #005aff;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    /* Video Container */
    .video-container {
      width: 100%;
      max-width: 480px;
      margin: 60px auto 0;
    }
    .video-card {
      width: 100%;
      aspect-ratio: 9/16;
      background: #1a1a1a;
      position: relative;
      margin-bottom: 10px;
      border: 2px solid #333;
      overflow: hidden;
      border-radius: 8px;
    }
    .video-embed {
      width: 100%;
      height: 100%;
      border: none;
    }
    .no-video {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 80vh;
      color: #888;
      font-size: 16px;
    }

    /* Side Actions */
    .side-actions {
      position: absolute;
      right: 12px;
      bottom: 80px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      align-items: center;
    }
    .side-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }
    .side-btn span {
      font-size: 12px;
    }
    .icon {
      font-size: 28px;
    }

    /* Bottom Nav */
    .bottom-nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: #000;
      border-top: 1px solid #333;
      display: flex;
      justify-content: space-around;
      padding: 10px 0;
      z-index: 100;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      cursor: pointer;
    }
    .nav-item span {
      font-size: 11px;
    }
    .nav-icon {
      font-size: 22px;
    }
    .create-btn {
      background: linear-gradient(90deg, #d81e05, #005aff);
      width: 45px;
      height: 35px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: bold;
    }

    /* Modal */
    .modal {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.9);
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-content {
      background: #222;
      padding: 25px;
      border-radius: 12px;
      width: 100%;
      max-width: 420px;
    }
    .modal-title {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 20px;
      text-align: center;
    }
    input, textarea {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border: none;
      border-radius: 6px;
      background: #333;
      color: #fff;
      font-size: 15px;
    }
    .modal-buttons {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }
    .btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      font-size: 15px;
    }
    .btn-cancel { background: #444; color: #fff; }
    .btn-submit { background: #005aff; color: #fff; }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div></div>
    <div>ไทยโพธิ์ดี ช็อป</div>
    <button class="upload-btn" onclick="openModal()">อัปโหลด</button>
  </div>

  <!-- Video Feed -->
  <div class="video-container" id="videoFeed">
    <div class="no-video">ยังไม่มีวิดีโอ อัปโหลดวิดีโอแรกของคุณเลยนะ!</div>
  </div>

  <!-- Bottom Navigation -->
  <div class="bottom-nav">
    <div class="nav-item"><span class="nav-icon">🏠</span><span>หน้าแรก</span></div>
    <div class="nav-item"><span class="nav-icon">🔍</span><span>ค้นหา</span></div>
    <div class="nav-item" onclick="openModal()"><span class="create-btn">+</span></div>
    <div class="nav-item"><span class="nav-icon">💬</span><span>ข้อความ</span></div>
    <div class="nav-item"><span class="nav-icon">👤</span><span>โปรไฟล์</span></div>
  </div>

  <!-- Upload Modal -->
  <div class="modal" id="uploadModal">
    <div class="modal-content">
      <div class="modal-title">เพิ่มวิดีโอ</div>
      <input type="text" id="videoLink" placeholder="วางลิงก์วิดีโอ (YouTube, TikTok, Facebook ฯลฯ)">
      <textarea id="videoDesc" placeholder="ใส่คำอธิบายวิดีโอ..." rows="3"></textarea>
      <div class="modal-buttons">
        <button class="btn btn-cancel" onclick="closeModal()">ยกเลิก</button>
        <button class="btn btn-submit" onclick="submitVideo()">โพสต์</button>
      </div>
    </div>
  </div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
  <script>
    // ===== FIREBASE CONFIG — ใส่ของคุณตรงนี้ =====
    const firebaseConfig = {
      apiKey: "AIzaSyCzXbXzW8xQ0f8KtY5Y5a8a9a8a9a8a9a8a9a8a9",
      authDomain: "thaipodee-shop.firebaseapp.com",
      databaseURL: "https://thaipodee-shop-default-rtdb.firebaseio.com/",
      projectId: "thaipodee-shop",
      storageBucket: "thaipodee-shop.appspot.com",
      messagingSenderId: "123456789012",
      appId: "1:123456789012:web:abc123def456ghi789jkl01"
    };
    // ==============================================

    // Init Firebase
    const app = firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Open/Close Modal
    function openModal() {
      document.getElementById('uploadModal').style.display = 'flex';
    }
    function closeModal() {
      document.getElementById('uploadModal').style.display = 'none';
      document.getElementById('videoLink').value = '';
      document.getElementById('videoDesc').value = '';
    }

    // Normalize video link to embed format
    function convertToEmbed(link) {
      if (!link) return '';
      
      // YouTube
      const ytMatch = link.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([^&?/]+)/);
      if (ytMatch) return `https://www.youtube.com/embed/${ytMatch[1]}`;
      
      // TikTok
      const ttMatch = link.match(/tiktok\.com\/@[^/]+\/video\/(\d+)/);
      if (ttMatch) return `https://www.tiktok.com/embed/v2/${ttMatch[1]}`;
      
      // Facebook
      const fbMatch = link.match(/facebook\.com\/.*\/videos\/(\d+)/);
      if (fbMatch) return `https://www.facebook.com/plugins/video.php?href=${encodeURIComponent(link)}`;
      
      return link;
    }

    // Submit Video
    async function submitVideo() {
      const link = document.getElementById('videoLink').value.trim();
      const desc = document.getElementById('videoDesc').value.trim();
      
      if (!link) { alert('กรุณาใส่ลิงก์วิดีโอครับ!'); return; }
      
      const embedUrl = convertToEmbed(link);
      
      const newPost = {
        link: embedUrl,
        originalLink: link,
        description: desc,
        likes: 0,
        comments: 0,
        saves: 0,
        shares: 0,
        createdAt: Date.now()
      };
      
      await db.ref('posts').push(newPost);
      alert('โพสต์สำเร็จ! ✅');
      closeModal();
    }

    // Render Posts
    function renderPosts(snapshot) {
      const feed = document.getElementById('videoFeed');
      feed.innerHTML = '';
      
      const posts = [];
      snapshot.forEach(child => {
        posts.push({ id: child.key, ...child.val() });
      });
      
      if (posts.length === 0) {
        feed.innerHTML = '<div class="no-video">ยังไม่มีวิดีโอ อัปโหลดวิดีโอแรกของคุณเลยนะ!</div>';
        return;
      }
      
      // เรียงล่าสุดก่อน
      posts.sort((a, b) => b.createdAt - a.createdAt);
      
      posts.forEach(post => {
        const card = document.createElement('div');
        card.className = 'video-card';
        card.innerHTML = `
          <iframe class="video-embed" src="${post.link}" allowfullscreen allow="autoplay; encrypted-media"></iframe>
          <div class="side-actions">
            <div class="side-btn"><span class="icon">👤</span><span>โปรไฟล์</span></div>
            <div class="side-btn"><span class="icon">❤️</span><span>${post.likes || 0}</span></div>
            <div class="side-btn"><span class="icon">💬</span><span>${post.comments || 0}</span></div>
            <div class="side-btn"><span class="icon">⭐</span><span>${post.saves || 0}</span></div>
            <div class="side-btn"><span class="icon">🔁</span><span>${post.shares || 0}</span></div>
            <div class="side-btn"><span class="icon">🎵</span></div>
          </div>
        `;
        feed.appendChild(card);
      });
    }

    // Load Posts on Start
    db.ref('posts').on('value', renderPosts);
  </script>

</body>
</html>
