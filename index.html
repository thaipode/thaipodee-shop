<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="https://res.cloudinary.com/du7z0r5q9/image/upload/v1726090000/thaipodee-icon.png">
  <title>Thaipodee Market Online V2026</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background: #000; color: #fff; height: 100vh; height: 100dvh; overflow: hidden; }

    .video-container { position: relative; width: 100%; height: 100%; }
    video { width: 100%; height: 100%; object-fit: cover; }

    /* แถบไอคอนด้านขวา — 6 อัน เรียงตรงกัน */
    .right-icons {
      position: absolute;
      right: 12px;
      bottom: 180px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      z-index: 10;
    }
    .icon-group { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .icon { font-size: 28px; cursor: pointer; text-shadow: 0 0 4px rgba(0,0,0,0.5); }
    .icon-text { font-size: 11px; color: #fff; }

    /* ✅ ตัวที่ 6 จานเสียง/รูปวงกลม — กลมเต็มวง ไม่มีเหลี่ยม! เป็นตัวเดียวกัน! */
    .music-avatar-wrap {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border: 2px solid #fff;
      box-shadow: 0 0 0 1px rgba(0,0,0,0.2);
    }
    .music-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      object-fit: cover;
      object-position: center;
      display: block;
    }

    /* ✅ ซ่อนตัวสี่เหลี่ยมที่ซ้อน — หายไปเลย! */
    .small-video-preview {
      display: none !important;
      width: 0 !important;
      height: 0 !important;
      opacity: 0 !important;
      visibility: hidden !important;
      position: absolute !important;
      pointer-events: none !important;
      z-index: -999 !important;
    }

    .video-info {
      position: absolute;
      left: 16px;
      bottom: 90px;
      right: 80px;
      z-index: 5;
    }
    .video-title { font-size: 15px; font-weight: 600; margin-bottom: 6px; }
    .video-desc { font-size: 13px; opacity: 0.8; line-height: 1.4; }

    .bottom-nav {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 65px;
      background: rgba(0,0,0,0.8);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 10;
    }
    .nav-item { text-align: center; cursor: pointer; }
    .nav-icon { font-size: 24px; }
    .nav-text { font-size: 10px; color: #ccc; }
    .nav-center { font-size: 36px; }
  </style>
</head>
<body>

<div class="video-container">
  <video id="mainVideo" src="" loop playsinline></video>

  <div class="video-info">
    <div class="video-title">ชื่อวิดีโอ</div>
    <div class="video-desc">คำอธิบายวิดีโอ</div>
  </div>

  <!-- ✅ ไอคอนด้านขวา 6 อัน — ตัวสุดท้ายกลมเต็มวง เป็นตัวเดียวกัน! -->
  <div class="right-icons">
    <div class="icon-group"><div class="icon">👤</div></div>
    <div class="icon-group"><div class="icon">❤️</div><div class="icon-text">0</div></div>
    <div class="icon-group"><div class="icon">💬</div><div class="icon-text">0</div></div>
    <div class="icon-group"><div class="icon">🔖</div><div class="icon-text">0</div></div>
    <div class="icon-group"><div class="icon">↗️</div><div class="icon-text">17</div></div>
    <!-- ✅ ตัวที่ 6 จานเสียง — วงกลมขาว + รูปกลมในนั้น = ตัวเดียวกัน! ไม่มีเหลี่ยม! -->
    <div class="icon-group">
      <div class="music-avatar-wrap">
        <img class="music-avatar" src="" alt="เสียงต้นฉบับ" id="avatar-image">
      </div>
    </div>
  </div>

  <!-- ❌ ตัวสี่เหลี่ยม — ซ่อนทิ้ง ห้ามแสดง! -->
  <img class="small-video-preview" src="" alt="ปกวิดีโอ">

  <div class="bottom-nav">
    <div class="nav-item"><div class="nav-icon">🏠</div><div class="nav-text">หน้าแรก</div></div>
    <div class="nav-item"><div class="nav-icon">🛒</div><div class="nav-text">ร้านค้า</div></div>
    <div class="nav-item"><div class="nav-icon nav-center">➕</div></div>
    <div class="nav-item"><div class="nav-icon">💬</div><div class="nav-text">กล่องข้อความ</div></div>
    <div class="nav-item"><div class="nav-icon">👤</div><div class="nav-text">โปรไฟล์</div></div>
  </div>
</div>

<script>
  const video = document.getElementById('mainVideo');
  const avatarImage = document.getElementById('avatar-image');

  document.querySelector('.video-container').addEventListener('click', () => {
    video.paused ? video.play() : video.pause();
  });

  // ✅ ถ้าโหลดรูป ให้ส่งไปที่ avatarImage ตัวนี้เท่านั้น
  // avatarImage.src = "ลิงก์รูป";
</script>

</body>
</html>
