<h1>🛒 ไทยโพธิ์ดีช็อป</h1>

<div id="upload-form" style="margin: 30px 0; padding: 20px; background: #222; border-radius: 12px;">
  <h3 style="color: #ffd700; margin-bottom: 15px;">📤 อัปโหลดวิดีโอ</h3>
  <input type="text" id="video-name" placeholder="ชื่อวิดีโอ" style="width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 6px; border: none; background: #333; color: #fff;">
  <input type="file" id="video-file" accept="video/*" style="width: 100%; padding: 10px; margin-bottom: 15px; color: #fff;">
  <button onclick="uploadVideo()" style="background: #ffd700; color: #000; border: none; padding: 12px 24px; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer;">อัปโหลดเลย</button>
  <div id="upload-status" style="margin-top: 15px; color: #0f0;"></div>
</div>

<div id="video-feed">
  <p class="no-video" id="no-video-text">ยังไม่มีวิดีโอ เป็นคนแรกที่อัปโหลดได้เลย!</p>
</div>

<script>
const API_URL = window.location.origin;

async function uploadVideo() {
  const nameInput = document.getElementById("video-name");
  const fileInput = document.getElementById("video-file");
  const status = document.getElementById("upload-status");
  
  if (!nameInput.value.trim()) {
    status.textContent = "⚠️ กรุณาใส่ชื่อวิดีโอ";
    status.style.color = "#f00";
    return;
  }
  if (!fileInput.files[0]) {
    status.textContent = "⚠️ กรุณาเลือกไฟล์วิดีโอ";
    status.style.color = "#f00";
    return;
  }
  
  status.textContent = "⏳ กำลังอัปโหลด...";
  status.style.color = "#ffd700";
  
  const formData = new FormData();
  formData.append("file", fileInput.files[0]);
  formData.append("title", nameInput.value);
  
  try {
    const res = await fetch(`${API_URL}/videos/`, {
      method: "POST",
      body: formData
    });
    const data = await res.json();
    if (res.ok) {
      status.textContent = "✅ อัปโหลดสำเร็จ!";
      status.style.color = "#0f0";
      nameInput.value = "";
      fileInput.value = "";
      loadVideos();
    } else {
      status.textContent = "❌ " + (data.detail || "อัปโหลดไม่สำเร็จ");
      status.style.color = "#f00";
    }
  } catch (err) {
    status.textContent = "❌ เกิดข้อผิดพลาด: " + err.message;
    status.style.color = "#f00";
  }
}

async function loadVideos() {
  try {
    const res = await fetch(`${API_URL}/videos/`);
    const videos = await res.json();
    const feed = document.getElementById("video-feed");
    const noVideo = document.getElementById("no-video-text");
    
    if (videos.length === 0) {
      noVideo.style.display = "block";
      return;
    }
    
    noVideo.style.display = "none";
    feed.innerHTML = "";
    
    videos.forEach(v => {
      const card = document.createElement("div");
      card.className = "video-card";
      card.innerHTML = `
        <h3 style="color: #ffd700; margin: 0 0 10px 0;">${v.title}</h3>
        <video controls style="width: 100%; border-radius: 8px;">
          <source src="${API_URL}${v.video_url}" type="video/mp4">
          เบราว์เซอร์ไม่รองรับวิดีโอ
        </video>
        <p style="color: #888; font-size: 12px; margin-top: 8px;">อัปโหลดเมื่อ: ${new Date(v.created_at).toLocaleString('th-TH')}</p>
      `;
      feed.appendChild(card);
    });
  } catch (err) {
    console.error("โหลดวิดีโอไม่ได้:", err);
  }
}

loadVideos();
</script>
